<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ORS Browser</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-titlebar: rgba(28, 28, 32, 0.85);
      --bg-toolbar: rgba(22, 22, 26, 0.9);
      --bg-tab: rgba(255, 255, 255, 0.05);
      --bg-tab-hover: rgba(255, 255, 255, 0.09);
      --bg-tab-active: rgba(255, 255, 255, 0.14);
      --bg-input: rgba(255, 255, 255, 0.08);
      --bg-input-focus: rgba(255, 255, 255, 0.12);
      --text-primary: #f0f0f2;
      --text-secondary: #a0a0a8;
      --text-dim: #6e6e78;
      --accent: #FF7A29;
      --border: rgba(255, 255, 255, 0.08);
      --danger: #ff5a4a;
      --secure: #4ade80;
      --insecure: #ff5a4a;
      --neutral: #6e6e78;
    }

    body {
      display: flex; flex-direction: column; height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: #0f0f12; color: var(--text-primary);
      overflow: hidden;
      user-select: none;
    }

    #titlebar {
      display: flex; align-items: center;
      height: 42px;
      background: var(--bg-titlebar);
      backdrop-filter: blur(20px);
      padding: 0 12px 0 8px;
      -webkit-app-region: drag;
      gap: 8px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      position: relative;
    }

    #logo {
      width: 28px; height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), #ff4f00);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 11px; color: #fff;
      -webkit-app-region: no-drag;
      flex-shrink: 0;
      margin-right: 4px;
      cursor: pointer;
      transition: transform 0.15s ease;
      letter-spacing: 0.5px;
      z-index: 2;
    }
    #logo:hover { transform: scale(1.08); }

    #tabs-bar {
      display: flex; align-items: center; gap: 4px;
      flex: 1; overflow-x: auto; height: 100%;
      -webkit-app-region: no-drag;
      padding-right: 120px;
      z-index: 2;
    }
    #tabs-bar::-webkit-scrollbar { display: none; }

    .tab {
      background: var(--bg-tab);
      color: var(--text-secondary);
      padding: 0 26px 0 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12.5px;
      max-width: 160px;
      min-width: 70px;
      overflow: hidden;
      height: 30px;
      position: relative;
      display: flex; align-items: center; gap: 8px;
      flex-shrink: 1;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .tab:hover { background: var(--bg-tab-hover); color: var(--text-primary); }
    .tab.active {
      background: var(--bg-tab-active);
      color: var(--text-primary);
      box-shadow: 0 1px 0 rgba(255,255,255,0.05) inset;
    }

    .tab .favicon {
      width: 16px; height: 16px;
      border-radius: 4px;
      background: rgba(255,255,255,0.08);
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      color: var(--accent);
    }
    .tab .favicon svg { width: 11px; height: 11px; }

    .tab .tab-title {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      flex: 1;
    }

    .tab .close {
      position: absolute; right: 6px; top: 50%;
      transform: translateY(-50%);
      width: 18px; height: 18px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      opacity: 0;
      transition: opacity 0.15s ease, background 0.15s ease;
      color: var(--text-secondary);
    }
    .tab .close svg { width: 10px; height: 10px; }
    .tab:hover .close, .tab.active .close { opacity: 0.7; }
    .tab .close:hover { background: var(--danger); opacity: 1; color: #fff; }

    .tab-add {
      background: transparent;
      color: var(--text-secondary);
      border: none;
      width: 30px; height: 30px;
      border-radius: 8px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s ease, color 0.15s ease, transform 0.1s ease;
    }
    .tab-add svg { width: 14px; height: 14px; }
    .tab-add:hover {
      background: var(--bg-tab-hover);
      color: var(--text-primary);
      transform: scale(1.05);
    }

    #title-center {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      max-width: 30%;
      font-size: 12.5px;
      color: var(--text-secondary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      pointer-events: none;
      z-index: 0;
      opacity: 0.7;
      transition: opacity 0.2s ease;
    }
    #title-center.hidden { opacity: 0; }

    #toolbar {
      display: flex;
      padding: 8px 12px;
      background: var(--bg-toolbar);
      backdrop-filter: blur(20px);
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
    }

    .nav-btn {
      background: transparent;
      color: var(--text-secondary);
      border: none;
      width: 34px; height: 34px;
      border-radius: 10px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s ease, color 0.15s ease, transform 0.1s ease;
      flex-shrink: 0;
    }
    .nav-btn svg { width: 16px; height: 16px; }
    .nav-btn:hover {
      background: var(--bg-tab-hover);
      color: var(--text-primary);
    }
    .nav-btn:active { transform: scale(0.94); }
    .nav-btn.active {
      background: rgba(255, 122, 41, 0.15);
      color: var(--accent);
    }

    #url-wrapper {
      flex: 1;
      position: relative;
      display: flex; align-items: center;
      background: var(--bg-input);
      border-radius: 12px;
      height: 36px;
      margin: 0 4px;
      transition: background 0.2s ease, box-shadow 0.2s ease;
    }
    #url-wrapper:focus-within {
      background: var(--bg-input-focus);
      box-shadow: 0 0 0 2px rgba(255, 122, 41, 0.25);
    }

    #lock-icon {
      padding: 0 6px 0 14px;
      color: var(--neutral);
      flex-shrink: 0;
      display: flex; align-items: center;
      transition: color 0.2s ease;
    }
    #lock-icon svg { width: 14px; height: 14px; display: block; }
    #lock-icon.secure { color: var(--secure); }
    #lock-icon.insecure { color: var(--insecure); }
    #lock-icon.neutral { color: var(--neutral); }

    #url-input {
      flex: 1;
      padding: 0 12px 0 0;
      border: none;
      background: transparent;
      color: var(--text-primary);
      font-size: 13.5px;
      outline: none;
      height: 100%;
      font-family: inherit;
    }
    #url-input::placeholder { color: var(--text-dim); }

    #engine-badge {
      background: rgba(255, 122, 41, 0.15);
      color: var(--accent);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.3px;
      white-space: nowrap;
      user-select: none;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    #engine-badge:hover {
      background: rgba(255, 122, 41, 0.25);
      transform: scale(1.04);
    }

    .webview-container {
      flex: 1;
      position: relative;
      background: #fff;
      overflow: hidden;
    }
    webview {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      display: none;
    }
    webview.active { display: flex; }

    #emoji-picker {
      position: fixed;
      bottom: 80px;
      right: 20px;
      width: 340px;
      max-height: 420px;
      background: rgba(28, 28, 32, 0.98);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      display: none;
      flex-direction: column;
      z-index: 1000;
      overflow: hidden;
    }
    #emoji-picker.show { display: flex; }

    #emoji-header {
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #emoji-close {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #emoji-close:hover { background: var(--bg-tab-hover); color: var(--text-primary); }
    #emoji-close svg { width: 12px; height: 12px; }

    #emoji-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 4px;
      padding: 10px;
      overflow-y: auto;
      max-height: 360px;
    }
    #emoji-grid::-webkit-scrollbar { width: 6px; }
    #emoji-grid::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.15);
      border-radius: 3px;
    }

    .emoji-item {
      background: transparent;
      border: none;
      font-size: 22px;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      transition: background 0.12s ease, transform 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .emoji-item:hover {
      background: var(--bg-tab-hover);
      transform: scale(1.15);
    }
  </style>
</head>
<body>
  <div id="titlebar">
    <div id="logo" onclick="goHome()" title="Home">ORS</div>
    <div id="tabs-bar"></div>
    <div id="title-center"></div>
  </div>

  <div id="toolbar">
    <button class="nav-btn" onclick="goBack()" title="Назад">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button class="nav-btn" onclick="goForward()" title="Вперёд">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button class="nav-btn" onclick="reload()" title="Обновить">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 12a8 8 0 1 1-2.3-5.6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M20 4v5h-5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <div id="url-wrapper">
      <span id="lock-icon" class="neutral">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2"/>
        </svg>
      </span>
      <input type="text" id="url-input" placeholder="Поиск или адрес" onkeypress="handleKeyPress(event)">
    </div>

    <button class="nav-btn" id="emoji-btn" onclick="toggleEmojiPicker()" title="Эмодзи">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
        <circle cx="9" cy="10" r="1.2" fill="currentColor"/>
        <circle cx="15" cy="10" r="1.2" fill="currentColor"/>
        <path d="M8.5 14.5c1 1.2 2.2 1.8 3.5 1.8s2.5-.6 3.5-1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>

    <button class="nav-btn" id="devtools-btn" onclick="openDevTools()" title="Инструменты разработчика">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 9l-3 3 3 3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M16 9l3 3-3 3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M14 5l-4 14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
    </button>

    <span id="engine-badge" onclick="goHome()" title="Open Ru Search">ORS</span>
  </div>

  <div class="webview-container" id="views"></div>

  <div id="emoji-picker">
    <div id="emoji-header">
      <span>Эмодзи</span>
      <button id="emoji-close" onclick="toggleEmojiPicker()" title="Закрыть">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div id="emoji-grid"></div>
  </div>

  <script>
    const HOME_URL = 'https://ors.tb.ru/';

    const EMOJIS = [
      '😀','😃','😄','😁','😆','😅','🤣','😂','🙂','🙃','😉','😊','😇','🥰','😍','🤩',
      '😘','😗','😚','😙','😋','😛','😜','🤪','😝','🤑','🤗','🤭','🤫','🤔','🤐','🤨',
      '😐','😑','😶','😏','😒','🙄','😬','🤥','😌','😔','😪','🤤','😴','😷','🤒','🤕',
      '🤢','🤮','🤧','🥵','🥶','🥴','😵','🤯','🤠','🥳','😎','🤓','🧐','😕','😟','🙁',
      '😮','😯','😲','😳','🥺','😦','😧','😨','😰','😥','😢','😭','😱','😖','😣','😞',
      '😓','😩','😫','🥱','😤','😡','😠','🤬','😈','👿','💀','☠️','💩','🤡','👹','👺',
      '👻','👽','👾','🤖','😺','😸','😹','😻','😼','😽','🙀','😿','😾','🙈','🙉','🙊',
      '❤️','🧡','💛','💚','💙','💜','🖤','🤍','🤎','💔','❣️','💕','💞','💓','💗','💖',
      '👍','👎','👌','✌️','🤞','🤟','🤘','🤙','👈','👉','👆','👇','☝️','✋','🤚','🖐️',
      '👋','🤝','🙏','💪','🦾','🖕','✊','👊','🤛','🤜','👏','🙌','👐','🤲','🤝','💅'
    ];

    const LOCK_SECURE_SVG = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="5" y="10" width="14" height="10" rx="2" stroke="currentColor" stroke-width="2"/>
      <path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <circle cx="12" cy="15" r="1.4" fill="currentColor"/>
    </svg>`;

    const LOCK_INSECURE_SVG = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="5" y="10" width="14" height="10" rx="2" stroke="currentColor" stroke-width="2"/>
      <path d="M8 10V7a4 4 0 0 1 7.5-2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <circle cx="12" cy="15" r="1.4" fill="currentColor"/>
    </svg>`;

    const LOCK_NEUTRAL_SVG = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2"/>
    </svg>`;

    const TAB_ICON_SVG = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="2"/>
      <path d="M3 9h18" stroke="currentColor" stroke-width="2"/>
    </svg>`;

    const CLOSE_ICON_SVG = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
    </svg>`;

    const PLUS_ICON_SVG = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    </svg>`;

    let tabs = [];
    let activeTabId = null;
    let nextId = 1;

    const tabsBar = document.getElementById('tabs-bar');
    const viewsContainer = document.getElementById('views');
    const urlInput = document.getElementById('url-input');
    const engineBadge = document.getElementById('engine-badge');
    const lockIcon = document.getElementById('lock-icon');
    const titleCenter = document.getElementById('title-center');
    const devtoolsBtn = document.getElementById('devtools-btn');
    const emojiPicker = document.getElementById('emoji-picker');
    const emojiGrid = document.getElementById('emoji-grid');

    const engineNames = {
      'google': 'Google', 'yandex': 'Яндекс', 'ddg': 'DuckDuckGo',
      'bing': 'Bing', 'brave': 'Brave', 'mailru': 'Mail.ru',
      'rambler': 'Rambler', 'qwant': 'Qwant', 'ecosia': 'Ecosia',
      'baidu': 'Baidu', 'naver': 'Naver', 'startpage': 'Startpage',
      'kagi': 'Kagi', 'mojeek': 'Mojeek', 'yahoo': 'Yahoo',
      'perplexity': 'Perplexity', 'seznam': 'Seznam',
      'swisscows': 'Swisscows', 'sogou': 'Sogou', 'coccoc': 'Coc Coc',
      'gogo': 'Gogo.ru'
    };

    function updateTitleCenterVisibility() {
      if (tabs.length > 5) {
        titleCenter.classList.add('hidden');
      } else {
        titleCenter.classList.remove('hidden');
      }
    }

    function createTab(url = HOME_URL) {
      const id = nextId++;
      const tabEl = document.createElement('div');
      tabEl.className = 'tab';
      tabEl.dataset.id = id;
      tabEl.innerHTML = `
        <span class="favicon">${TAB_ICON_SVG}</span>
        <span class="tab-title">Новая вкладка</span>
        <span class="close">${CLOSE_ICON_SVG}</span>
      `;

      const view = document.createElement('webview');
      view.dataset.id = id;
      view.src = url;

      view.addEventListener('page-title-updated', (e) => {
        const title = e.title || 'Новая вкладка';
        tabEl.querySelector('.tab-title').textContent = title;
        if (activeTabId === id) titleCenter.textContent = title;
      });

      view.addEventListener('did-navigate', (e) => {
        if (activeTabId === id) {
          urlInput.value = e.url;
          updateLockIcon(e.url);
        }
        syncEngineFromWebview(view);
      });

      view.addEventListener('did-navigate-in-page', (e) => {
        if (activeTabId === id) {
          urlInput.value = e.url;
          updateLockIcon(e.url);
        }
      });

      view.addEventListener('dom-ready', () => {
        if (activeTabId === id) syncEngineFromWebview(view);
      });

      view.addEventListener('devtools-opened', () => {
        if (activeTabId === id) devtoolsBtn.classList.add('active');
      });
      view.addEventListener('devtools-closed', () => {
        if (activeTabId === id) devtoolsBtn.classList.remove('active');
      });

      view.addEventListener('new-window', (e) => {
        e.preventDefault();
        if (e.url && (e.url.startsWith('http') || e.url.startsWith('file'))) {
          createTab(e.url);
        }
      });

      tabEl.querySelector('.close').addEventListener('click', (e) => {
        e.stopPropagation();
        closeTab(id);
      });
      tabEl.addEventListener('click', () => activateTab(id));

      tabsBar.appendChild(tabEl);
      viewsContainer.appendChild(view);
      tabs.push({ id, tabEl, view });
      activateTab(id);
      updateTitleCenterVisibility();
      return id;
    }

    function activateTab(id) {
      activeTabId = id;
      tabs.forEach(t => {
        const isActive = t.id === id;
        t.tabEl.classList.toggle('active', isActive);
        t.view.classList.toggle('active', isActive);
      });
      const tab = tabs.find(t => t.id === id);
      if (tab) {
        const u = tab.view.getURL() || '';
        urlInput.value = u;
        updateLockIcon(u);
        const title = tab.view.getTitle() || 'Новая вкладка';
        titleCenter.textContent = title;
        syncEngineFromWebview(tab.view);
        if (tab.view.isDevToolsOpened()) devtoolsBtn.classList.add('active');
        else devtoolsBtn.classList.remove('active');
      }
      updateTitleCenterVisibility();
    }

    function closeTab(id) {
      const idx = tabs.findIndex(t => t.id === id);
      if (idx === -1) return;
      const tab = tabs[idx];
      if (tab.view.isDevToolsOpened()) tab.view.closeDevTools();
      tab.tabEl.remove();
      tab.view.remove();
      tabs.splice(idx, 1);
      if (tabs.length === 0) createTab();
      else if (activeTabId === id) activateTab(tabs[Math.max(0, idx - 1)].id);
      updateTitleCenterVisibility();
    }

    function getActiveView() {
      const tab = tabs.find(t => t.id === activeTabId);
      return tab ? tab.view : null;
    }

    function updateLockIcon(url) {
      lockIcon.classList.remove('secure', 'insecure', 'neutral');
      if (!url) {
        lockIcon.innerHTML = LOCK_NEUTRAL_SVG;
        lockIcon.classList.add('neutral');
        return;
      }
      if (url.startsWith('https://')) {
        lockIcon.innerHTML = LOCK_SECURE_SVG;
        lockIcon.classList.add('secure');
      } else if (url.startsWith('http://')) {
        lockIcon.innerHTML = LOCK_INSECURE_SVG;
        lockIcon.classList.add('insecure');
      } else {
        lockIcon.innerHTML = LOCK_NEUTRAL_SVG;
        lockIcon.classList.add('neutral');
      }
    }

    function syncEngineFromWebview(view) {
      if (!view) return;
      view.executeJavaScript(`
        (function() {
          try { return localStorage.getItem('ors_selected_engine') || null; }
          catch(e) { return null; }
        })();
      `).then(engineId => {
        if (engineId && engineNames[engineId]) {
          engineBadge.textContent = engineNames[engineId];
        } else {
          engineBadge.textContent = 'ORS';
        }
      }).catch(() => { engineBadge.textContent = 'ORS'; });
    }

    function goBack()    { const v = getActiveView(); if (v && v.canGoBack()) v.goBack(); }
    function goForward() { const v = getActiveView(); if (v && v.canGoForward()) v.goForward(); }
    function reload()    { const v = getActiveView(); if (v) v.reload(); }
    function goHome()    { const v = getActiveView(); if (v) v.loadURL(HOME_URL); }

    function openDevTools() {
      const v = getActiveView();
      if (!v) return;
      if (v.isDevToolsOpened()) {
        v.closeDevTools();
        devtoolsBtn.classList.remove('active');
      } else {
        v.openDevTools({ mode: 'right' });
        devtoolsBtn.classList.add('active');
      }
    }

    function toggleEmojiPicker() {
      emojiPicker.classList.toggle('show');
    }

    function insertEmoji(emoji) {
      const v = getActiveView();
      if (!v) return;
      v.executeJavaScript(`
        (function() {
          const el = document.activeElement;
          if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable)) {
            if (el.isContentEditable) {
              document.execCommand('insertText', false, '${emoji}');
            } else {
              const start = el.selectionStart || 0;
              const end = el.selectionEnd || 0;
              const val = el.value || '';
              el.value = val.slice(0, start) + '${emoji}' + val.slice(end);
              el.selectionStart = el.selectionEnd = start + '${emoji}'.length;
              el.dispatchEvent(new Event('input', { bubbles: true }));
            }
            return true;
          }
          return false;
        })();
      `).catch(() => {});
    }

    function buildEmojiGrid() {
      emojiGrid.innerHTML = '';
      EMOJIS.forEach(e => {
        const btn = document.createElement('button');
        btn.className = 'emoji-item';
        btn.textContent = e;
        btn.addEventListener('click', () => insertEmoji(e));
        emojiGrid.appendChild(btn);
      });
    }

    function handleKeyPress(e) {
      if (e.key !== 'Enter') return;
      const v = getActiveView();
      if (!v) return;
      let input = urlInput.value.trim();
      if (!input) return;
      if (input.includes('.') && !input.includes(' ')) {
        if (!input.startsWith('http')) input = 'https://' + input;
        v.loadURL(input);
      } else {
        v.loadURL(`${HOME_URL}?q=${encodeURIComponent(input)}`);
      }
      urlInput.blur();
    }

    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'i') {
        e.preventDefault();
        openDevTools();
      }
      if (e.ctrlKey && e.key.toLowerCase() === 'r') {
        e.preventDefault();
        reload();
      }
      if (e.ctrlKey && e.key.toLowerCase() === 't') {
        e.preventDefault();
        createTab();
      }
      if (e.ctrlKey && e.key.toLowerCase() === 'w') {
        e.preventDefault();
        if (activeTabId) closeTab(activeTabId);
      }
      if (e.key === 'Escape') {
        emojiPicker.classList.remove('show');
      }
    });

    document.addEventListener('click', (e) => {
      if (!emojiPicker.contains(e.target) && e.target.id !== 'emoji-btn' && !e.target.closest('#emoji-btn')) {
        emojiPicker.classList.remove('show');
      }
    });

    const addBtn = document.createElement('button');
    addBtn.className = 'tab-add';
    addBtn.title = 'Новая вкладка';
    addBtn.innerHTML = PLUS_ICON_SVG;
    addBtn.addEventListener('click', () => createTab());
    tabsBar.appendChild(addBtn);

    buildEmojiGrid();
    createTab(HOME_URL);

    try {
      const { ipcRenderer } = require('electron');
      ipcRenderer.on('create-tab', (event, url) => {
        if (url) createTab(url);
      });
      ipcRenderer.on('open-emoji', () => {
        emojiPicker.classList.add('show');
      });
    } catch (e) {}
  </script>
</body>
</html>
